name: MapForge connected-scene quick QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'js/connection.js'
      - 'js/world.js'
      - 'js/analysis.js'
      - '.github/workflows/connected-visual-qa.yml'
concurrency:
  group: mapforge-connected-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  connected-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Capture Warehouse and Area 1
        shell: bash
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const {spawn}=require('node:child_process');
          const fs=require('node:fs');
          const path=require('node:path');
          const out=path.resolve('connected-qa');fs.rmSync(out,{recursive:true,force:true});fs.mkdirSync(out,{recursive:true});
          const nap=ms=>new Promise(r=>setTimeout(r,ms));
          async function wait(){for(let i=0;i<80;i++){try{const r=await fetch('http://127.0.0.1:8735/');if(r.ok)return;}catch{}await nap(250)}throw Error('server timeout')}
          (async()=>{
            const server=spawn('python3',['-m','http.server','8735','--bind','127.0.0.1'],{stdio:'ignore'});
            let browser;
            try{
              await wait();
              browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-webgl','--enable-unsafe-swiftshader','--disable-dev-shm-usage','--no-sandbox']});
              const ctx=await browser.newContext({viewport:{width:1600,height:900}});
              const dm=await ctx.newPage();
              await dm.goto('http://127.0.0.1:8735/index.html',{waitUntil:'domcontentloaded'});
              await dm.locator('#loadingOverlay').waitFor({state:'hidden',timeout:45000});
              await nap(1200);
              await dm.locator('#viewWarehouse').click();await nap(650);
              await dm.screenshot({path:path.join(out,'warehouse-orbit.png'),timeout:60000});
              await dm.locator('#walkMode').click();await nap(650);
              await dm.screenshot({path:path.join(out,'warehouse-first-person.png'),timeout:60000});
              await dm.locator('#orbitMode').click();await dm.locator('#viewArea1').click();await nap(650);
              await dm.screenshot({path:path.join(out,'area1-orbit.png'),timeout:60000});
              await dm.locator('#walkMode').click();await nap(650);
              await dm.screenshot({path:path.join(out,'area1-first-person.png'),timeout:60000});
              await dm.locator('#orbitMode').click();
              const tv=await ctx.newPage();
              await tv.goto('http://127.0.0.1:8735/tv.html',{waitUntil:'domcontentloaded'});
              await tv.locator('#status').waitFor({state:'hidden',timeout:90000});await nap(900);
              await tv.screenshot({path:path.join(out,'tv-live-area1.png'),timeout:60000});
            }finally{
              if(browser)await browser.close();
              server.kill();
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload connected-scene frames
        uses: actions/upload-artifact@v4
        with:
          name: mapforge-connected-qa
          path: connected-qa/
          if-no-files-found: error
