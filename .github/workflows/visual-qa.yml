name: MapForge visual QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tv.html'
      - 'js/**'
      - 'css/**'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/visual-qa.yml'
permissions:
  contents: write
jobs:
  screenshot-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Capture Orbit, Explore, TV, and Episode 1 scenes
        run: node tests/visual-qa.cjs
      - name: Validate image frames are not empty
        if: success()
        run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image, ImageStat
          from pathlib import Path
          for f in sorted(Path('qa-artifacts').glob('*.png')):
              im=Image.open(f).convert('RGB')
              stat=ImageStat.Stat(im)
              print(f.name, im.size, 'stddev:', [round(x,2) for x in stat.stddev])
              assert im.width >= 800 and im.height >= 450, f'{f} too small'
              # Blackout is intentionally an entirely dark frame.
              if 'blackout' not in f.name:
                  assert max(stat.stddev) > 7, f'{f} appears blank/uniform'
              if f.name == '02-director-first-person.png':
                  crop=im.crop((650,180,1200,690))
                  pixels=list(crop.getdata())
                  white=sum(1 for r,g,b in pixels if min(r,g,b)>210)/len(pixels)
                  print('Explore occlusion fraction:',round(white,3))
                  assert white < .28, f'First-person view obstructed by a bright wall: {white:.0%}'
          PY
      - name: Upload QA screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapforge-visual-qa
          path: qa-artifacts/
          if-no-files-found: warn

      - name: Prepare small visual QA previews
        if: always()
        shell: bash
        run: |
          python -m pip install --quiet pillow
          mkdir -p qa-preview
          python - <<'PYCODE'
          from PIL import Image
          from pathlib import Path
          for p in sorted(Path('qa-artifacts').glob('*.png')):
              with Image.open(p) as im:
                  im.convert('RGB').resize((1200,675)).save(Path('qa-preview')/(p.stem+'.jpg'),quality=75,optimize=True)
          PYCODE
          test ! -f qa-artifacts/results.json || cp qa-artifacts/results.json qa-preview/results.json
          test ! -f qa-artifacts/failure.txt || cp qa-artifacts/failure.txt qa-preview/failure.txt
      - name: Publish visual QA previews to GitHub
        if: always()
        shell: bash
        run: |
          if [ -z "$(find qa-preview -maxdepth 1 -type f -print -quit)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f qa-preview/
          git commit -m "Save visual QA previews for $GITHUB_SHA [skip ci]" || exit 0
          git push origin HEAD:main